<style>
  :root {
    --bg: #F2F3F7;
    --surface: #FFFFFF;
    --surface-2: #E9EBF3;
    --ink: #21245C;
    --ink-soft: #62668D;
    --ink-faint: #8A8EAF;
    --line: #DFE2EE;
    --accent: #00ADED;
    --accent-ink: #FFFFFF;
    --miss: #E34554;
    --shadow: 0 10px 28px rgba(33, 36, 92, .12);
    --shadow-sm: 0 2px 8px rgba(33, 36, 92, .08);
    --radius: 18px;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101229;
      --surface: #1B1E42;
      --surface-2: #262A56;
      --ink: #EDEEF6;
      --ink-soft: #A7ABCF;
      --ink-faint: #7C81A8;
      --line: #2E3365;
      --accent: #3AC6F5;
      --accent-ink: #0B1026;
      --miss: #F2717C;
      --shadow: 0 10px 28px rgba(0, 0, 0, .45);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101229;
    --surface: #1B1E42;
    --surface-2: #262A56;
    --ink: #EDEEF6;
    --ink-soft: #A7ABCF;
    --ink-faint: #7C81A8;
    --line: #2E3365;
    --accent: #3AC6F5;
    --accent-ink: #0B1026;
    --miss: #F2717C;
    --shadow: 0 10px 28px rgba(0, 0, 0, .45);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 18px;
    padding-block: 18px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---- header ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-soft);
  }
  .theme-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    width: 42px;
    height: 42px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
    transition: border-color .15s ease, color .15s ease;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .theme-btn svg { width: 19px; height: 19px; display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  :root[data-theme="light"] .icon-sun { display: none; }
  :root:not([data-theme="dark"]) .icon-sun { display: none; }
  :root:not([data-theme="dark"]) .icon-moon { display: block; }
  :root[data-theme="dark"] .icon-sun { display: block; }

  /* ---- order control ---- */
  .segmented {
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 5px;
  }
  .seg {
    appearance: none;
    border: 0;
    flex: 1 1 0;
    min-width: 0;
    padding: 11px 8px;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .seg[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: var(--shadow-sm);
  }

  /* ---- progress ---- */
  .meter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .tallies { display: flex; gap: 14px; }
  .tally { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.hit { background: var(--accent); }
  .dot.miss { background: var(--miss); }
  .bar {
    height: 4px;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width .3s ease;
  }

  /* ---- card ---- */
  .card {
    border: 0;
    padding: 0;
    margin: 0;
    display: block;
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: left;
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .card img {
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1920 / 1080;
    object-fit: cover;
    background: var(--surface-2);
  }

  #playView, #doneView {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #playView[hidden], #doneView[hidden] { display: none !important; }

  /* ---- answer ---- */
  .answer {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 2px 2px 0;
  }
  .tag {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tile-title {
    margin: 0;
    font-size: 22px;
    line-height: 1.3;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
    text-wrap: balance;
  }

  /* ---- buttons ---- */
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    appearance: none;
    width: 100%;
    border-radius: 999px;
    padding: 17px 20px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow-sm); }
  .btn-miss { background: var(--miss); color: #FFFFFF; box-shadow: var(--shadow-sm); }
  .btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn-quiet:hover { border-color: var(--ink-faint); }

  /* ---- round summary ---- */
  .summary {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .summary .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .score {
    font-size: 46px;
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .score small {
    display: block;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .missed-list {
    list-style: none;
    margin: 14px 0 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .missed-list li { display: flex; flex-direction: column; gap: 2px; }
  .missed-list .m-tag {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--miss);
  }
  .missed-list .m-title { font-size: 15px; color: var(--ink); line-height: 1.35; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Culture Tile Quiz</h1>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch between light and dark">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="segmented" role="group" aria-label="Card order">
    <button class="seg" type="button" id="segDf" data-order="df" aria-pressed="true">DF Order</button>
    <button class="seg" type="button" id="segWall" data-order="wall" aria-pressed="false">Wall</button>
    <button class="seg" type="button" id="segRandom" data-order="random" aria-pressed="false">Random</button>
  </div>

  <div class="meter">
    <span id="counter">0 / 35</span>
    <span class="tallies">
      <span class="tally"><i class="dot hit"></i><span id="hitCount">0</span></span>
      <span class="tally"><i class="dot miss"></i><span id="missCount">0</span></span>
    </span>
  </div>
  <div class="bar"><i id="barFill"></i></div>

  <div id="playView">
    <button class="card" id="card" type="button" aria-label="Reveal this tile">
      <img id="cardImg" alt="Culture tile illustration">
    </button>

    <div class="answer" id="answer" hidden>
      <span class="tag" id="cardTag"></span>
      <h2 class="tile-title" id="cardTitle"></h2>
    </div>

    <div class="actions" id="revealActions">
      <button class="btn btn-quiet" id="revealBtn" type="button">Reveal</button>
    </div>

    <div class="actions" id="scoreActions" hidden>
      <button class="btn btn-accent" id="gotBtn" type="button">Got it</button>
      <button class="btn btn-miss" id="missBtn" type="button">Missed it</button>
    </div>

  </div>

  <div id="doneView" hidden>
    <div class="summary">
      <span class="eyebrow" id="doneMode">DF Order</span>
      <div class="score" id="doneScore">35 / 35<small>clean on the first look</small></div>
      <ul class="missed-list" id="missedList" hidden></ul>
    </div>
    <div class="actions">
      <button class="btn btn-accent" id="againBtn" type="button">Run it again</button>
      <button class="btn btn-quiet" id="drillBtn" type="button" hidden>Quiz the ones you missed</button>
    </div>
  </div>
</div>

<script>
(function () {
  var DECK = [{"id":"001","title":"Spit on it. Stomp on it. Tell it it's stupid. Still has the same value.","tag":"Worth","df":1,"wall":35,"img":"tiles/001.jpg"},{"id":"002","title":"We like the original you at the very core.","tag":"Worth","df":2,"wall":1,"img":"tiles/002.jpg"},{"id":"003","title":"Learning from failure is essential to progress.","tag":"Failure","df":3,"wall":30,"img":"tiles/003.jpg"},{"id":"004","title":"Success is just failure that’s been played around with... a lot.","tag":"Failure","df":4,"wall":34,"img":"tiles/004.jpg"},{"id":"005","title":"Enthusiasm is shallow. Passion runs deep.","tag":"Mission","df":5,"wall":9,"img":"tiles/005.jpg"},{"id":"006","title":"It’s your birthright to matter. Purpose is how you make it happen.","tag":"Mission","df":6,"wall":13,"img":"tiles/006.jpg"},{"id":"007","title":"Life is too short not to do something that matters.","tag":"Mission","df":7,"wall":31,"img":"tiles/007.jpg"},{"id":"008","title":"Mission leads to money, not vice versa.","tag":"Mission","df":8,"wall":19,"img":"tiles/008.jpg"},{"id":"009","title":"The ripple effect... Intention → Making a difference → Success and money.","tag":"Mission","df":9,"wall":27,"img":"tiles/009.jpg"},{"id":"010","title":"Buy the decision.","tag":"Growth","df":10,"wall":29,"img":"tiles/010.jpg"},{"id":"011","title":"Create growth by creating the problem.","tag":"Growth","df":11,"wall":11,"img":"tiles/011.jpg"},{"id":"012","title":"Growth mindset begins with personal growth.","tag":"Growth","df":12,"wall":8,"img":"tiles/012.jpg"},{"id":"013","title":"Hunger is the best spice.","tag":"Growth","df":13,"wall":5,"img":"tiles/013.jpg"},{"id":"014","title":"Racing cars... When you push the limits, you crash more often. C’est la guerre.","tag":"Growth","df":14,"wall":23,"img":"tiles/014.jpg"},{"id":"015","title":"Risk... How much we got your back.","tag":"Growth","df":15,"wall":4,"img":"tiles/015.jpg"},{"id":"016","title":"Foundational... Stop whining. Start owning.","tag":"Ownership","df":16,"wall":17,"img":"tiles/016.jpg"},{"id":"017","title":"Leadership. Ownership.","tag":"Ownership","df":17,"wall":32,"img":"tiles/017.jpg"},{"id":"018","title":"Owners own their relationships. Employees rent them.","tag":"Ownership","df":18,"wall":6,"img":"tiles/018.jpg"},{"id":"019","title":"Ownership can only be accepted, not assigned.","tag":"Ownership","df":19,"wall":20,"img":"tiles/019.jpg"},{"id":"020","title":"Assume good intent.","tag":"Candor","df":20,"wall":14,"img":"tiles/020.jpg"},{"id":"021","title":"Being around strong people requires a thick skin.","tag":"Candor","df":21,"wall":21,"img":"tiles/021.jpg"},{"id":"022","title":"Feedback comes from the heart, not ego.","tag":"Candor","df":22,"wall":28,"img":"tiles/022.jpg"},{"id":"023","title":"Truth over harmony.","tag":"Candor","df":23,"wall":25,"img":"tiles/023.jpg"},{"id":"024","title":"Lift while we climb.","tag":"Sharpen Each Other","df":24,"wall":2,"img":"tiles/024.jpg"},{"id":"025","title":"People come to us to sharpen their sword, so we need to always be sharpening ours.","tag":"Sharpen Each Other","df":25,"wall":22,"img":"tiles/025.jpg"},{"id":"026","title":"When we level up, we elevate each other’s journey.","tag":"Sharpen Each Other","df":26,"wall":33,"img":"tiles/026.jpg"},{"id":"027","title":"From me to we.","tag":"We","df":27,"wall":18,"img":"tiles/027.jpg"},{"id":"028","title":"Nobody has all the answers. That’s why we have each other.","tag":"We","df":28,"wall":7,"img":"tiles/028.jpg"},{"id":"029","title":"One bad apple doesn’t write the rules.","tag":"We","df":29,"wall":12,"img":"tiles/029.jpg"},{"id":"030","title":"People are human, hence the constant need for forgiveness. Put it behind you and move on.","tag":"We","df":30,"wall":24,"img":"tiles/030.jpg"},{"id":"031","title":"We have fun!","tag":"We","df":31,"wall":16,"img":"tiles/031.jpg"},{"id":"032","title":"All models are wrong, but some are useful.","tag":"Perspective","df":32,"wall":3,"img":"tiles/032.jpg"},{"id":"033","title":"The best way to sell is to create experiences and meaning.","tag":"Selling","df":33,"wall":10,"img":"tiles/033.jpg"},{"id":"034","title":"Boss is not a useful term.","tag":"Hierarchy","df":34,"wall":26,"img":"tiles/034.jpg"},{"id":"035","title":"Hierarchical on the inside. Flat on the outside.","tag":"Hierarchy","df":35,"wall":15,"img":"tiles/035.jpg"}];

  var root = document.documentElement;
  var els = {
    card: document.getElementById('card'),
    img: document.getElementById('cardImg'),
    answer: document.getElementById('answer'),
    tag: document.getElementById('cardTag'),
    title: document.getElementById('cardTitle'),
    revealActions: document.getElementById('revealActions'),
    scoreActions: document.getElementById('scoreActions'),
    revealBtn: document.getElementById('revealBtn'),
    gotBtn: document.getElementById('gotBtn'),
    missBtn: document.getElementById('missBtn'),
    counter: document.getElementById('counter'),
    hitCount: document.getElementById('hitCount'),
    missCount: document.getElementById('missCount'),
    barFill: document.getElementById('barFill'),
    playView: document.getElementById('playView'),
    doneView: document.getElementById('doneView'),
    doneMode: document.getElementById('doneMode'),
    doneScore: document.getElementById('doneScore'),
    missedList: document.getElementById('missedList'),
    againBtn: document.getElementById('againBtn'),
    drillBtn: document.getElementById('drillBtn'),
    themeBtn: document.getElementById('themeBtn')
  };

  var MODE_LABEL = { df: 'DF Order', wall: 'Wall', random: 'Random' };

  var state = {
    mode: 'df',
    queue: [],
    total: 0,
    seen: 0,
    hits: 0,
    misses: 0,
    firstTry: 0,
    missedIds: [],
    revealed: false,
    subset: null
  };

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildOrder(mode, subset) {
    var pool = DECK.slice();
    if (subset && subset.length) {
      pool = pool.filter(function (c) { return subset.indexOf(c.id) !== -1; });
    }
    if (mode === 'random') return shuffle(pool);
    var key = mode === 'wall' ? 'wall' : 'df';
    return pool.sort(function (a, b) { return a[key] - b[key]; });
  }

  function startRound(mode, subset) {
    state.mode = mode;
    state.subset = subset || null;
    state.queue = buildOrder(mode, subset).map(function (c) { return { card: c, first: true }; });
    state.total = state.queue.length;
    state.seen = 0;
    state.hits = 0;
    state.misses = 0;
    state.firstTry = 0;
    state.missedIds = [];
    els.doneView.hidden = true;
    els.playView.hidden = false;
    showCard();
  }

  function showCard() {
    if (!state.queue.length) return finish();
    var item = state.queue[0];
    state.revealed = false;
    els.img.src = item.card.img;
    els.answer.hidden = true;
    els.revealActions.hidden = false;
    els.scoreActions.hidden = true;
    els.tag.textContent = item.card.tag;
    els.title.textContent = item.card.title;
    els.card.setAttribute('aria-label', 'Reveal this tile');
    updateMeter();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function reveal() {
    if (state.revealed || !state.queue.length) return;
    state.revealed = true;
    els.answer.hidden = false;
    els.revealActions.hidden = true;
    els.scoreActions.hidden = false;
    els.card.setAttribute('aria-label', els.title.textContent);
    els.gotBtn.focus({ preventScroll: true });
  }

  function score(got) {
    if (!state.revealed || !state.queue.length) return;
    var item = state.queue.shift();
    if (got) {
      state.hits++;
      if (item.first) state.firstTry++;
    } else {
      state.misses++;
      if (item.first && state.missedIds.indexOf(item.card.id) === -1) {
        state.missedIds.push(item.card.id);
      }
      state.queue.push({ card: item.card, first: false });
    }
    state.seen++;
    showCard();
  }

  function updateMeter() {
    var left = state.queue.length;
    var done = state.total - left;
    els.counter.textContent = done + ' / ' + state.total;
    els.hitCount.textContent = state.hits;
    els.missCount.textContent = state.misses;
    els.barFill.style.width = (state.total ? (done / state.total) * 100 : 0) + '%';
  }

  function finish() {
    els.playView.hidden = true;
    els.doneView.hidden = false;
    els.counter.textContent = state.total + ' / ' + state.total;
    els.barFill.style.width = '100%';
    els.doneMode.textContent = MODE_LABEL[state.mode];

    var note = state.firstTry === state.total
      ? 'clean on the first look'
      : 'right on the first look';
    els.doneScore.innerHTML = '';
    els.doneScore.appendChild(document.createTextNode(state.firstTry + ' / ' + state.total));
    var small = document.createElement('small');
    small.textContent = note;
    els.doneScore.appendChild(small);

    els.missedList.innerHTML = '';
    if (state.missedIds.length) {
      state.missedIds.forEach(function (id) {
        var c = DECK.filter(function (d) { return d.id === id; })[0];
        if (!c) return;
        var li = document.createElement('li');
        var t = document.createElement('span');
        t.className = 'm-tag';
        t.textContent = c.tag;
        var n = document.createElement('span');
        n.className = 'm-title';
        n.textContent = c.title;
        li.appendChild(t);
        li.appendChild(n);
        els.missedList.appendChild(li);
      });
      els.missedList.hidden = false;
      els.drillBtn.hidden = false;
    } else {
      els.missedList.hidden = true;
      els.drillBtn.hidden = true;
    }
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---- controls ---- */
  Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (o) {
        o.setAttribute('aria-pressed', String(o === b));
      });
      startRound(b.dataset.order, null);
    });
  });

  els.card.addEventListener('click', function () {
    if (!state.revealed) reveal();
  });
  els.revealBtn.addEventListener('click', reveal);
  els.gotBtn.addEventListener('click', function () { score(true); });
  els.missBtn.addEventListener('click', function () { score(false); });
  els.againBtn.addEventListener('click', function () { startRound(state.mode, null); });
  els.drillBtn.addEventListener('click', function () { startRound(state.mode, state.missedIds.slice()); });

  document.addEventListener('keydown', function (e) {
    if (!els.playView.hidden) {
      if (e.code === 'Space' || e.key === 'Enter') {
        if (!state.revealed) { e.preventDefault(); reveal(); }
        return;
      }
      if (!state.revealed) return;
      if (e.key === 'ArrowRight' || e.key === '1') { e.preventDefault(); score(true); }
      if (e.key === 'ArrowLeft' || e.key === '2') { e.preventDefault(); score(false); }
    }
  });

  /* ---- theme: defaults to light ---- */
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('ctd-theme', t); } catch (err) {}
  }
  var saved = 'light';
  try { saved = localStorage.getItem('ctd-theme') || 'light'; } catch (err) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  els.themeBtn.addEventListener('click', function () {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  startRound('df', null);

  /* warm the cache so flipping never waits on a download */
  setTimeout(function () {
    DECK.forEach(function (c) { var i = new Image(); i.src = c.img; });
  }, 400);
})();
</script>

</body>
</html>
